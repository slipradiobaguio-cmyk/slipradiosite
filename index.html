<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Slip Radio</title>
  <meta name="description" content="Live-streaming DJ radio. Tune in, see who's live, and browse past and upcoming shows.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/gate.css">
</head>
<body>
  <header class="site-header container">
    <a href="/" class="site-logo" data-nav-link>
      <img src="/assets/icons/logo.png" alt="Slip Radio" class="site-logo__img">
    </a>
    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        <li><a href="/about" data-nav-link>About</a></li>
        <li><a href="/shows" data-nav-link>Shows</a></li>
        <li><a href="/support-us" data-nav-link>Support</a></li>
        <li class="live-indicator" data-state="loading">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-indicator__label">Connecting</span>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-section page-section--tight container">
      <h1 class="visually-hidden">Slip Radio — featured shows</h1>
      <div class="shows-grid shows-grid--home" data-limit="4" aria-busy="true"></div>
      <div class="hero-carousel-progress" aria-hidden="true">
        <div class="hero-carousel-progress__fill"></div>
      </div>
    </section>

    <section class="page-section container">
      <div class="schedule">
        <div class="schedule__head">
          <span>Schedule</span>
          <span data-clock></span>
        </div>
        <div class="schedule__rows" data-schedule-rows aria-busy="true"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer container">
    <div>
      <span class="site-logo site-logo--text">slip radio</span>
      <p>Live every Sunday</p>
    </div>
    <address>
      Ridgeus-01 Left Wing Goshen and Towers<br>
      Upper General Luna<br>
      2400 Baguio City · PH
    </address>
    <div class="site-footer__links">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="mailto:program.slipradio@gmail.com">program.slipradio@gmail.com</a>
    </div>
  </footer>

  <div class="now-playing" data-state="loading">
    <button class="now-playing__toggle" type="button" aria-label="Play" disabled>
      <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>
      <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>
    </button>
    <div class="now-playing__info">
      <div class="now-playing__title">Connecting to stream…</div>
      <div class="now-playing__artist"></div>
    </div>
    <div class="now-playing__volume">
      <svg class="now-playing__volume-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8v4h3l4 4V4L6 8H3z" fill="currentColor" stroke="none"/>
        <path d="M13 7.5a3 3 0 0 1 0 5"/>
        <path d="M15.5 5.5a6.5 6.5 0 0 1 0 9"/>
      </svg>
      <input type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
    </div>
  </div>

  <script src="/js/no-zoom.js" defer></script>
  <script src="/js/gate.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/now-playing.js" defer></script>
  <script src="/js/shows.js" defer></script>
  <script src="/js/schedule.js" defer></script>
</body>
</html>
