<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Admin — Slip Radio</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body style="padding-bottom: var(--space-lg);">
  <header class="site-header container">
    <a href="/" class="site-logo">
      <img src="/assets/icons/logo.png" alt="Slip Radio" class="site-logo__img">
    </a>
    <span class="admin-status">Admin</span>
  </header>

  <main class="container admin-layout">
    <!--
      Access to this page/API is expected to be gated by Cloudflare Access
      at the platform level (dashboard config), not by any login code here.
    -->
    <h1 class="visually-hidden">Admin</h1>

    <div class="admin-live-banner">
      <span class="live-indicator" data-onair-banner data-state="offline">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-indicator__label" data-onair-banner-label>Checking on-air status…</span>
      </span>
    </div>

    <div class="admin-tabs" role="tablist">
      <button type="button" class="admin-tabs__btn" data-tab-button="list" role="tab" aria-selected="true">List</button>
      <button type="button" class="admin-tabs__btn" data-tab-button="form" role="tab" aria-selected="false">Add show</button>
      <button type="button" class="admin-tabs__btn" data-tab-button="submissions" role="tab" aria-selected="false">Submissions<span class="admin-tabs__badge" data-submissions-badge hidden></span></button>
      <button type="button" class="admin-tabs__btn" data-tab-button="schedule" role="tab" aria-selected="false">Schedule</button>
      <button type="button" class="admin-tabs__btn" data-tab-button="chat" role="tab" aria-selected="false">Chat</button>
    </div>

    <p class="admin-status" data-admin-status></p>

    <section data-tab-panel="list">
      <p class="admin-status" data-list-empty hidden>No shows yet — add one below.</p>

      <div class="admin-group" data-group="today" hidden>
        <h2 class="admin-group__title">Today <span class="admin-group__count" data-group-count="today"></span></h2>
        <div class="admin-list" data-admin-list="today"></div>
      </div>
      <div class="admin-group" data-group="upcoming" hidden>
        <h2 class="admin-group__title">Upcoming <span class="admin-group__count" data-group-count="upcoming"></span></h2>
        <div class="admin-list" data-admin-list="upcoming"></div>
      </div>
      <div class="admin-group" data-group="past" hidden>
        <h2 class="admin-group__title">Past <span class="admin-group__count" data-group-count="past"></span></h2>
        <div class="admin-list" data-admin-list="past"></div>
      </div>
    </section>

    <section data-tab-panel="form" hidden>
      <h2 data-form-title>Add a show</h2>
      <form class="admin-form" data-admin-form>
        <div>
          <label for="field-title">Title</label>
          <input type="text" id="field-title" name="title" required>
        </div>
        <div>
          <label for="field-slug">Slug</label>
          <input type="text" id="field-slug" name="slug" required>
        </div>
        <div class="admin-form__row admin-form__row--split">
          <div>
            <label for="field-date">Date</label>
            <input type="date" id="field-date" name="date">
          </div>
          <div>
            <label for="field-time">Time</label>
            <select data-time-preset>
              <option value="">Choose a slot…</option>
              <option value="00:00 - 02:00">00:00 – 02:00</option>
              <option value="02:00 - 04:00">02:00 – 04:00</option>
              <option value="04:00 - 06:00">04:00 – 06:00</option>
              <option value="06:00 - 08:00">06:00 – 08:00</option>
              <option value="08:00 - 10:00">08:00 – 10:00</option>
              <option value="10:00 - 12:00">10:00 – 12:00</option>
              <option value="12:00 - 14:00">12:00 – 14:00</option>
              <option value="14:00 - 16:00">14:00 – 16:00</option>
              <option value="16:00 - 18:00">16:00 – 18:00</option>
              <option value="18:00 - 20:00">18:00 – 20:00</option>
              <option value="20:00 - 22:00">20:00 – 22:00</option>
              <option value="22:00 - 00:00">22:00 – 00:00</option>
              <option value="custom">Custom…</option>
            </select>
            <input type="text" id="field-time" name="time" placeholder="16:00 - 18:00">
          </div>
        </div>
        <div>
          <label for="field-genres">Genres</label>
          <input type="text" id="field-genres" name="genres" placeholder="Ambient, Techno, Dub">
        </div>
        <div>
          <label for="field-guestName">Guest name / collective</label>
          <input type="text" id="field-guestName" name="guestName">
        </div>
        <div>
          <label for="field-socialLink">Social media link</label>
          <input type="url" id="field-socialLink" name="socialLink" placeholder="https://">
        </div>
        <div>
          <label for="field-description">Description</label>
          <textarea id="field-description" name="description"></textarea>
        </div>
        <div>
          <label>Hero image</label>
          <div class="admin-form__thumb-preview" data-field="heroImagePreview"></div>
          <input type="file" accept="image/*">
        </div>
        <div class="admin-list__actions">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn" data-action="cancel">Cancel</button>
        </div>
      </form>
    </section>

    <section data-tab-panel="submissions" hidden>
      <p class="admin-status" data-submissions-empty hidden>No submissions yet.</p>
      <div class="admin-submissions" data-submissions-list></div>
    </section>

    <section data-tab-panel="schedule" hidden>
      <h2 data-slot-form-title>Add a timeslot</h2>
      <form class="admin-form admin-form--inline" data-slot-form>
        <div class="admin-form__row admin-form__row--triple">
          <div>
            <label for="slot-date">Date</label>
            <input type="date" id="slot-date" name="date" required>
          </div>
          <div>
            <label for="slot-start">Start</label>
            <input type="time" id="slot-start" name="startTime" required>
          </div>
          <div>
            <label for="slot-end">End</label>
            <input type="time" id="slot-end" name="endTime" required>
          </div>
        </div>
        <div class="admin-list__actions">
          <button type="submit" class="btn btn--primary">Add timeslot</button>
        </div>
      </form>

      <p class="admin-status" data-slots-empty hidden>No timeslots yet — add one above.</p>
      <div class="admin-slots" data-slots-list></div>
    </section>

    <section data-tab-panel="chat" hidden>
      <div class="admin-chat">
        <div class="admin-chat__feed" data-admin-chat-feed></div>
        <form class="admin-chat__composer" data-admin-chat-form>
          <input type="text" data-admin-chat-input placeholder="Message the room as slip radio…" maxlength="240" autocomplete="off">
          <button type="submit" class="btn btn--primary">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/no-zoom.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
